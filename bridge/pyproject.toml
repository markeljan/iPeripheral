[project]
name = "tonypi-phone"
version = "0.1.0"
description = "Bridge between Tony's mounted iPhone and the TonyPi robot (tonyd + agent sockets), plus an MCP server for the phone's senses"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "websockets>=15"]

[project.scripts]
tonypi-phone = "tonypi_phone.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
