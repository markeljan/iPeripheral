name: iPeripheral
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  TonyLink:
    path: Packages/TonyLink
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iPeripheral:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - path: App/Models
        optional: true
    configFiles:
      Debug: App/Config/Signing.xcconfig
      Release: App/Config/Signing.xcconfig
    dependencies:
      - package: TonyLink
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        # llama.cpp (scripts/fetch-vendor.sh): linked for device builds only, its release has no Simulator slice.
        # Swift code checks `canImport(llama)`, so Simulator builds get a stub.
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/Vendor
        OTHER_LDFLAGS[sdk=iphoneos*]: -framework llama
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed llama.framework (device)
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = iphoneos ] || exit 0
          dest="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$dest"
          rsync -a --delete "$SRCROOT/Vendor/llama.framework" "$dest/"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,entitlements "$dest/llama.framework"
          fi
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tony Eyes
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Tony uses the camera as its eyes.
        NSMicrophoneUsageDescription: Tony listens for "hey Tony" through the microphone.
        NSSpeechRecognitionUsageDescription: Tony turns what you say into commands on this phone.
        NSLocalNetworkUsageDescription: Tony's phone talks to the robot over your Wi-Fi.
        NSBonjourServices: [_tonypi-phone._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
